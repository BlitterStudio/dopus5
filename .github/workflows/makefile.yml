name: Makefile CI

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+*'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ftp-tests:
    runs-on: ubuntu-latest
    name: ftp-host-tests

    steps:
      - uses: actions/checkout@v6

      - name: Install SFTP test dependencies
        run: sudo apt-get update && sudo apt-get install -y libssh2-1-dev pkg-config

      - name: Run FTP host tests
        run: |
          make -C source/Modules/ftp -f makefile.tests test
          make -C source/Modules/ftp -f makefile.tests test-libssh2

  aros-debug-build:
    needs: ftp-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: i386-aros, image: "midwan/aros-compiler:i386-aros" }
          - { name: x86_64-aros, image: "midwan/aros-compiler:x86_64-aros" }

    name: aros-debug-build-${{ matrix.platform.name }}

    steps:
      - uses: actions/checkout@v6

      - name: Clean DEBUG build (${{ matrix.platform.name }})
        run: |
          docker run --rm -v ${{ github.workspace }}:/work ${{ matrix.platform.image }} sh -c "cd /work/source && make ${{ matrix.platform.name }} clean && make ${{ matrix.platform.name }} all debug=yes"

  build:
    needs: ftp-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The sacredbanana/amiga-compiler tags are mutable and are rebuilt in
        # place, so CI can break on commits that change nothing relevant. An
        # upstream rebuild on 2026-07-04 shipped a ppc-morphos image whose amd64
        # cc1 cannot be executed ("posix_spawn: Exec format error"), which broke
        # every MorphOS build. Pin by digest instead; bump these deliberately
        # after verifying a newer image builds.
        #
        # m68k-amigaos / ppc-amigaos: current images (2026-07-04), verified green.
        # ppc-morphos: last known-good image (2025-08-31, GCC 15.1.0). The
        #   2026-07-04 rebuild (GCC 15.2.0) is broken - see above.
        platform:
          - { name: os3, image: "sacredbanana/amiga-compiler@sha256:7fa7056330ce0e7b31b5e497070b3380b4f672d7d6f169ac5b3003c1af483215" }
          - { name: os3-68000, image: "sacredbanana/amiga-compiler@sha256:7fa7056330ce0e7b31b5e497070b3380b4f672d7d6f169ac5b3003c1af483215" }
          - { name: os4, image: "sacredbanana/amiga-compiler@sha256:7cd544cdbd6bf58a552e93183cc58e6268800305c10d5913dac96f2433c33d24" }
          - { name: mos, image: "sacredbanana/amiga-compiler@sha256:464de9e085367f16605c34cb8c544a3ab1dcb92f494e826a004a12a501a83829" }
          - { name: i386-aros, image: "midwan/aros-compiler:i386-aros" }
          - { name: x86_64-aros, image: "midwan/aros-compiler:x86_64-aros" }
        variant:
          - { name: debug,   flags: "",          suffix: "_debug" }
          - { name: release, flags: "debug=no",  suffix: "" }

    name: build-${{ matrix.platform.name }}-${{ matrix.variant.name }}

    steps:
      - uses: actions/checkout@v6

      - name: Build (${{ matrix.platform.name }} ${{ matrix.variant.name }})
        run: |
          docker run --rm -v ${{ github.workspace }}:/work ${{ matrix.platform.image }} sh -c "cd /work/source && make ${{ matrix.platform.name }} all ${{ matrix.variant.flags }}"
          docker run --rm -v ${{ github.workspace }}:/work ${{ matrix.platform.image }} sh -c "cd /work/source && make ${{ matrix.platform.name }} release-package ${{ matrix.variant.flags }}"

      - uses: actions/upload-artifact@v7
        with:
          name: DOpus5_${{ matrix.platform.name }}${{ matrix.variant.suffix }}
          path: releases/DOpus5_*_${{ matrix.platform.name }}*.lha
          if-no-files-found: error

  release:
    needs: [build, aros-debug-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/DOpus5_*_os3.lha,artifacts/DOpus5_*_os3-68000.lha,artifacts/DOpus5_*_os4.lha,artifacts/DOpus5_*_mos.lha,artifacts/DOpus5_*_i386-aros.lha,artifacts/DOpus5_*_x86_64-aros.lha"
          generateReleaseNotes: true
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
