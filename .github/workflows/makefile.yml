name: Makefile CI

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+*'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ftp-tests:
    runs-on: ubuntu-latest
    name: ftp-host-tests

    steps:
      - uses: actions/checkout@v6

      - name: Install SFTP test dependencies
        run: sudo apt-get update && sudo apt-get install -y libssh2-1-dev pkg-config

      - name: Run FTP host tests
        run: |
          make -C source/Modules/ftp -f makefile.tests test
          make -C source/Modules/ftp -f makefile.tests test-libssh2

  aros-debug-build:
    needs: ftp-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: i386-aros, image: "midwan/aros-compiler:i386-aros" }
          - { name: x86_64-aros, image: "midwan/aros-compiler:x86_64-aros" }

    name: aros-debug-build-${{ matrix.platform.name }}

    steps:
      - uses: actions/checkout@v6

      - name: Clean DEBUG build (${{ matrix.platform.name }})
        run: |
          docker run --rm -v ${{ github.workspace }}:/work ${{ matrix.platform.image }} sh -c "cd /work/source && make ${{ matrix.platform.name }} clean && make ${{ matrix.platform.name }} all debug=yes"

  build:
    needs: ftp-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin tested Amiga toolchains by digest: tags are mutable, so an
        # upstream rebuild must not silently change release compilers.
        # Validate replacements with debug/release builds and LHA packaging.
        # os3 / os3-68000: sacredbanana m68k-amigaos (GCC 6.5.0b, 2026-07-04 image).
        #   The GCC 16.2.0b amigadev image is reverted: its binutils (2.46.0.20260504)
        #   emits synthesized library-call stubs whose base reference is relocated
        #   against the text hunk instead of the data hunk, so the first call through
        #   such a stub jumps through garbage at runtime (read.module, about.module,
        #   and others). Preserved on the toolchain/gcc16-os3 branch pending an
        #   upstream binutils fix.
        # os4: amigadev/crosstools:ppc-amigaos (GCC 11.5.0, AmiSSL + codesets)
        # mos: amigadev/crosstools:ppc-morphos (GCC 15.2.0, codesets)
        platform:
          - { name: os3, image: "sacredbanana/amiga-compiler@sha256:7fa7056330ce0e7b31b5e497070b3380b4f672d7d6f169ac5b3003c1af483215" }
          - { name: os3-68000, image: "sacredbanana/amiga-compiler@sha256:7fa7056330ce0e7b31b5e497070b3380b4f672d7d6f169ac5b3003c1af483215" }
          - { name: os4, image: "amigadev/crosstools@sha256:693cedf407e23957f5bb95340b9623388aa28e9a0e18f3128166ce79ee582545" }
          - { name: mos, image: "amigadev/crosstools@sha256:c5f0078722ace9139cd44e56838df369d7ca465fe49768ecf15a8e8cefe703de" }
          - { name: i386-aros, image: "midwan/aros-compiler:i386-aros" }
          - { name: x86_64-aros, image: "midwan/aros-compiler:x86_64-aros" }
          - { name: aarch64-aros, image: "midwan/aros-compiler:aarch64-aros" }
        variant:
          - { name: debug,   flags: "",          suffix: "_debug" }
          - { name: release, flags: "debug=no",  suffix: "" }

    name: build-${{ matrix.platform.name }}-${{ matrix.variant.name }}

    steps:
      - uses: actions/checkout@v6

      - name: Build (${{ matrix.platform.name }} ${{ matrix.variant.name }})
        run: |
          docker run --rm -v ${{ github.workspace }}:/work ${{ matrix.platform.image }} sh -c "cd /work/source && make ${{ matrix.platform.name }} all ${{ matrix.variant.flags }}"
          docker run --rm -v ${{ github.workspace }}:/work ${{ matrix.platform.image }} sh -c "cd /work/source && make ${{ matrix.platform.name }} release-package ${{ matrix.variant.flags }}"

      - uses: actions/upload-artifact@v7
        with:
          name: DOpus5_${{ matrix.platform.name }}${{ matrix.variant.suffix }}
          path: releases/DOpus5_*_${{ matrix.platform.name }}*.lha
          if-no-files-found: error

  release:
    needs: [build, aros-debug-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/DOpus5_*_os3.lha,artifacts/DOpus5_*_os3-68000.lha,artifacts/DOpus5_*_os4.lha,artifacts/DOpus5_*_mos.lha,artifacts/DOpus5_*_i386-aros.lha,artifacts/DOpus5_*_x86_64-aros.lha,artifacts/DOpus5_*_aarch64-aros.lha"
          generateReleaseNotes: true
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
